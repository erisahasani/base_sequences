[package]
name = "base_sequences"
version = "0.1.0"
edition = "2021"
authors = ["Implementation based on Wang & Zhu (2025)"]
description = "Implementation of base sequence, normal sequence, and near-normal sequence search algorithms"

[dependencies]
rayon = "1.8"  # For parallel computation
rand = "0.8"   # For randomized search

# GPU computing
wgpu = { version = "23.0", optional = true }
pollster = { version = "0.4", optional = true }  # For blocking on async wgpu calls
bytemuck = { version = "1.14", features = ["derive"], optional = true }  # For GPU buffer casting

[features]
default = []
gpu = ["wgpu", "pollster", "bytemuck"]

[dev-dependencies]
criterion = "0.5"

# [[bench]]
# name = "sequence_bench"
# harness = false
